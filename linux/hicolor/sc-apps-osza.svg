  <!-- crisp shadow for depth -->
  <path d="M 240 285 L 512 782 L 784 285 L 638 285 L 512 592 L 386 285 Z" transform="translate(0 20)" fill="#000000" opacity="0.30"/>
  <!-- gradient V -->
  <path d="M 240 285 L 512 782 L 784 285 L 638 285 L 512 592 L 386 285 Z" fill="url(#vGrad)"/>
