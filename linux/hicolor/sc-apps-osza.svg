<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241A47"/>
      <stop offset="1" stop-color="#100A22"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.45" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- dark rounded diamond -->
  <g transform="rotate(45 512 512)">
    <rect x="212" y="212" width="600" height="600" rx="150"
