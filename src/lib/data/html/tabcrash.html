<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>%TITLE%</title>
<link rel="stylesheet" href="qrc:html/oszapage.css">
<style>
/* Page-specific rules. Dynamic values (icon, translated strings)
   are substituted by WebPage in this document only. */
body { direction: %DIRECTION%; }

.vx-crash__head { display: flex; align-items: center; gap: 16px; margin-block-end: 6px; }
.vx-crash__head img { flex: none; inline-size: 45px; block-size: 45px; }

.vx-crash__list { margin-block: 16px 20px; padding-inline-start: 20px; text-align: start; color: var(--osza-text-dim); }
.vx-crash__list li { padding-block: 3px; }

#reloadButton { min-inline-size: 120px; }
</style>
</head>
<body>
<main class="vx-stage">
  <section class="vx-card" aria-label="%HEADING%">
    <div class="vx-crash__head">
      <img src="%IMAGE%" alt="">
      <h1 class="vx-title">%HEADING%</h1>
    </div>

    <ul class="vx-crash__list">
      <li>%LI-1%</li>
      <li>%LI-2%</li>
    </ul>

    <input class="vx-btn vx-btn--primary" type="submit" id="reloadButton" value="%RELOAD-PAGE%" onclick="window.location.reload()">
  </section>
</main>
</body>
</html>
