<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%TITLE%</title>
<link rel="stylesheet" href="qrc:html/oszapage.css">
<style>
/* Page-specific rules. Dynamic values (translated strings, the diff
   data of the requested baseline) are substituted by OszaSchemeHandler
   in this document only. All script below is plain JavaScript on
   purpose, and every dynamic string is inserted through textContent -
   the page never builds markup out of data. */

body { direction: %DIRECTION%; }

.sd-card { text-align: start; }

/* --- Header ------------------------------------------------------- */
.sd-head {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-block-end: 4px;
}

.sd-head__icon {
    inline-size: 54px;
    block-size: 54px;
    margin-block-end: 12px;
    padding: 12px;
    border: 1px solid var(--osza-accent-soft);
    border-radius: 17px;
    background: var(--osza-accent-dim);
    color: var(--osza-accent);
    animation: sd-pulse 3.2s var(--osza-ease) infinite;
}

@keyframes sd-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(var(--osza-accent-rgb), 0.26); }
    55% { box-shadow: 0 0 0 13px rgba(var(--osza-accent-rgb), 0); }
}

.sd-intro { color: var(--osza-text-dim); font-size: 13.5px; margin-block-end: 12px; }

/* --- Entrance ------------------------------------------------------ */
.sd-in { animation: sd-in 0.5s var(--osza-ease) both; animation-delay: calc(var(--i, 0) * 55ms); }

@keyframes sd-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
}

/* --- Summary banner ------------------------------------------------ */
.sd-banner {
    display: flex;
    align-items: baseline;
    gap: 11px;
    margin-block-start: 16px;
    padding: 12px 16px;
    border: 1px solid var(--osza-card-border);
    border-radius: var(--osza-radius-sm);
    background: var(--osza-card-bg);
    font-size: 14px;
}

.sd-banner::before {
    content: '';
    flex: none;
    align-self: center;
    inline-size: 9px;
    block-size: 9px;
    border-radius: 50%;
    background: var(--osza-text-faint);
}

.sd-banner--changes {
    border-color: rgba(var(--osza-accent-rgb), 0.50);
    background: var(--osza-accent-dim);
}

.sd-banner--changes::before {
    background: var(--osza-accent);
    box-shadow: 0 0 10px rgba(var(--osza-accent-rgb), 0.85);
}

.sd-banner--warn {
    border-color: rgba(255, 180, 84, 0.50);
    background: rgba(255, 180, 84, 0.10);
}

.sd-banner--warn::before { background: #ffb454; box-shadow: 0 0 10px rgba(255, 180, 84, 0.85); }

.sd-banner--fail {
    border-color: rgba(255, 84, 104, 0.50);
    background: rgba(255, 84, 104, 0.10);
}

.sd-banner--fail::before { background: #ff5468; box-shadow: 0 0 10px rgba(255, 84, 104, 0.85); }

@media (prefers-color-scheme: light) {
    .sd-banner--warn::before { background: #b06200; }
    .sd-banner--fail::before { background: #c81e3c; }
}

.sd-banner__text { min-inline-size: 0; }
.sd-banner__note { display: block; margin-block-start: 4px; color: var(--osza-text-dim); font-size: 12.5px; }

/* --- Overview: one card per baseline -------------------------------- */
.sd-presets { display: flex; flex-direction: column; gap: 9px; }

.sd-preset {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 12px;
    padding: 13px 16px;
    border: 1px solid var(--osza-card-border);
    border-radius: var(--osza-radius-sm);
    background: rgba(0, 0, 0, 0.14);
    color: var(--osza-text);
    text-decoration: none;
    transition: border-color var(--osza-speed) var(--osza-ease), box-shadow var(--osza-speed) var(--osza-ease), background var(--osza-speed) var(--osza-ease);
}

@media (prefers-color-scheme: light) {
    .sd-preset { background: rgba(255, 255, 255, 0.45); }
}

.sd-preset:hover, .sd-preset:focus-visible {
    border-color: rgba(var(--osza-accent-rgb), 0.55);
    box-shadow: var(--osza-glow);
    background: var(--osza-card-bg-hover);
}

.sd-preset__name { font-weight: 700; font-size: 14px; color: var(--osza-text); }

.sd-pill {
    justify-self: end;
    align-self: center;
    padding: 2px 11px;
    border: 1px solid var(--osza-card-border);
    border-radius: 999px;
    font-family: var(--osza-font-mono);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--osza-text-faint);
    white-space: nowrap;
}

.sd-pill--on {
    border-color: rgba(var(--osza-accent-rgb), 0.55);
    background: var(--osza-accent-dim);
    color: var(--osza-accent);
}

.sd-preset__desc { grid-column: 1 / -1; color: var(--osza-text-dim); font-size: 12.5px; }
.sd-preset__open { grid-column: 1 / -1; font-family: var(--osza-font-mono); font-size: 11px; color: var(--osza-accent); letter-spacing: 0.08em; text-transform: uppercase; }

/* --- Diff: the shared notation legend -------------------------------- */
.sd-legend {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    margin-block: 4px 6px;
    color: var(--osza-text-faint);
    font-family: var(--osza-font-mono);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
}

/* --- Diff: one section per tool -------------------------------------- */
.sd-tools { display: flex; flex-direction: column; gap: 10px; }

.sd-tool {
    padding: 11px 14px;
    border: 1px solid var(--osza-card-border);
    border-radius: var(--osza-radius-sm);
    background: rgba(0, 0, 0, 0.14);
}

@media (prefers-color-scheme: light) {
    .sd-tool { background: rgba(255, 255, 255, 0.45); }
}

.sd-tool__head { display: flex; align-items: center; gap: 9px; }

.sd-tool__name { font-weight: 700; font-size: 13.5px; }

.sd-tool__count {
    margin-inline-start: auto;
    font-family: var(--osza-font-mono);
    font-size: 10.5px;
    color: var(--osza-text-faint);
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

.sd-tool__head::before {
    content: '';
    flex: none;
    inline-size: 8px;
    block-size: 8px;
    border-radius: 2px;
    background: var(--osza-accent);
    box-shadow: 0 0 8px rgba(var(--osza-accent-rgb), 0.6);
}

/* --- Diff: one row per changed field ---------------------------------- */
.sd-change {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-block-start: 9px;
    padding: 9px 12px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.22);
}

@media (prefers-color-scheme: light) {
    .sd-change { background: rgba(15, 23, 42, 0.05); }
}

.sd-change__field { font-weight: 600; font-size: 13px; }

.sd-change__flow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

.sd-change__val {
    padding: 3px 10px;
    border: 1px solid var(--osza-card-border);
    border-radius: 7px;
    background: rgba(0, 0, 0, 0.28);
    font-family: var(--osza-font-mono);
    font-size: 12px;
    color: var(--osza-text);
    overflow-wrap: anywhere;
    min-inline-size: 0;
    -webkit-user-select: auto;
    user-select: auto;
}

@media (prefers-color-scheme: light) {
    .sd-change__val { background: rgba(15, 23, 42, 0.05); }
}

.sd-change__val--next {
    border-color: rgba(var(--osza-accent-rgb), 0.50);
    background: var(--osza-accent-dim);
    color: var(--osza-accent);
}

@media (prefers-color-scheme: light) {
    .sd-change__val--next { color: #00775d; }
}

.sd-change__arrow {
    flex: none;
    color: var(--osza-text-faint);
    font-family: var(--osza-font-mono);
    font-size: 14px;
}

[dir="rtl"] .sd-change__arrow { transform: scaleX(-1); }

/* The one-line summaries of a site-exception change: the same lines
   the import preview dialog shows under the same field. */
.sd-change__summary {
    margin: 0;
    color: var(--osza-text-dim);
    font-size: 12px;
    font-style: italic;
    overflow-wrap: anywhere;
}

.sd-change__summary::before { content: '↳ '; font-style: normal; color: var(--osza-text-faint); }

/* --- Diff: the plain lists (skipped, unchanged, quiet) ---------------- */
.sd-plainlist {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
}

.sd-plainlist li {
    display: flex;
    align-items: baseline;
    gap: 9px;
    padding: 8px 13px;
    border: 1px solid var(--osza-card-border);
    border-radius: var(--osza-radius-sm);
    background: rgba(0, 0, 0, 0.14);
    color: var(--osza-text-dim);
    font-size: 12.5px;
}

@media (prefers-color-scheme: light) {
    .sd-plainlist li { background: rgba(255, 255, 255, 0.45); }
}

.sd-plainlist li::before { flex: none; font-family: var(--osza-font-mono); font-weight: 700; }

.sd-plainlist--skipped li::before { content: '!'; color: #ffb454; }
.sd-plainlist--unchanged li::before { content: '—'; color: var(--osza-text-faint); }
.sd-plainlist--quiet li::before { content: '✓'; color: var(--osza-accent); }

@media (prefers-color-scheme: light) {
    .sd-plainlist--skipped li::before { color: #b06200; }
}

.sd-plainlist__item { min-inline-size: 0; overflow-wrap: anywhere; }

/* --- Links, footer ----------------------------------------------------- */
.sd-links { display: flex; flex-wrap: wrap; gap: 10px; }

.sd-footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    margin-block-start: 26px;
    padding-block-start: 16px;
    border-block-start: 1px solid var(--osza-card-border);
}

.sd-footer .vx-note { margin-inline-start: auto; }

/* --- Reduced motion ----------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
    .sd-head__icon { animation: none; }
    .sd-in { animation: none; }
    .sd-preset, .sd-preset:hover, .sd-preset:focus-visible { transition: none; }
}
</style>
</head>
<body>
<main class="vx-stage">
  <section class="vx-card vx-card--wide sd-card" id="osza-settingsdiff" aria-label="%TITLE%">
    <header class="sd-head">
      <svg class="sd-head__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v4"></path><path d="M12 17v4"></path><path d="M3 12h4"></path><path d="M17 12h4"></path><path d="M7.5 7.5 5.5 5.5"></path><path d="M18.5 5.5l-2 2"></path><path d="m7.5 16.5-2 2"></path><path d="m18.5 18.5-2-2"></path><path d="M12 12h.01"></path></svg>
      <h1 class="vx-title">%TITLE%</h1>
      <p class="vx-subtitle">%SUBTITLE%</p>
    </header>

    <noscript><p class="sd-intro">%JAVASCRIPT-DISABLED%</p></noscript>

    <div id="sd-content"></div>

    <div class="sd-footer">
      <button id="sd-reload" class="vx-btn vx-btn--primary" type="button">%RELOAD-LABEL%</button>
      <a id="sd-overview-link" class="vx-btn" href="osza:settings-diff">%ALL-BASELINES-LABEL%</a>
      <p class="vx-note">%FOOTER-NOTE%</p>
    </div>
  </section>
</main>

<script>
'use strict';

/*
 * Osza Browser security settings diff.
 *
 * Everything below renders the data the browser substituted (the
 * porter's preview of the requested baseline, or the overview), one
 * node per fact, every string through textContent. The page is a
 * preview: it applies nothing, and says where applying happens.
 */

var OSZA_DIFF = %DATA-JSON%;
var OSZA_I18N = %I18N-JSON%;

var reducedMotion = false;
try {
    reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
} catch (e) {
}

function t(key) {
    return OSZA_I18N[key] || key;
}

function tf(key, args) {
    var out = t(key);
    for (var i = 0; i < args.length; i++) {
        out = out.replace('%' + (i + 1), String(args[i]));
    }
    return out;
}

function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) {
        node.className = cls;
    }
    if (text !== undefined && text !== null) {
        node.textContent = text;
    }
    return node;
}

/* Entrance stagger: the index rides on a CSS custom property, so the
   animation stays in the stylesheet and respects reduced motion. */
function stagger(node, index) {
    if (!reducedMotion) {
        node.style.setProperty('--i', String(index));
    }
    return node;
}

var counts = {
    presetCards: 0,
    toolSections: 0,
    changeRows: 0,
    summaryRows: 0,
    skippedRows: 0,
    unchangedRows: 0,
    quietRows: 0
};

window.__oszaSettingsDiff = {
    mode: OSZA_DIFF.mode,
    data: OSZA_DIFF,
    counts: counts
};

/* --- Overview: one card per built-in baseline ------------------------- */

function renderOverview(root) {
    root.appendChild(el('h2', 'vx-h', '%OVERVIEW-HEADING%'));
    root.appendChild(el('p', 'sd-intro', '%OVERVIEW-INTRO%'));

    var list = el('div', 'sd-presets');
    var presets = OSZA_DIFF.presets || [];

    for (var i = 0; i < presets.length; i++) {
        var preset = presets[i];

        var card = el('a', 'sd-preset sd-in');
        card.href = 'osza:settings-diff?preset=' + encodeURIComponent(preset.id);
        stagger(card, i);

        card.appendChild(el('span', 'sd-preset__name', preset.name));

        var pill;
        if (preset.changes < 0) {
            pill = el('span', 'sd-pill', '…');
        } else if (preset.changes === 0) {
            pill = el('span', 'sd-pill sd-pill--on', t('pill_changes_none'));
        } else if (preset.changes === 1) {
            pill = el('span', 'sd-pill sd-pill--on', t('pill_changes_one'));
        } else {
            pill = el('span', 'sd-pill sd-pill--on', tf('pill_changes_many', [preset.changes]));
        }
        card.appendChild(pill);

        card.appendChild(el('span', 'sd-preset__desc', preset.description));
        card.appendChild(el('span', 'sd-preset__open', t('preset_open')));

        list.appendChild(card);
        counts.presetCards++;
    }

    root.appendChild(list);
}

/* --- Diff: the preview of one baseline --------------------------------- */

function toolsWithChanges(changes) {
    /* The preview lists changes in the fixed tool order; group the
       consecutive ones, exactly like the import preview dialog. */
    var order = [];
    var seen = {};
    for (var i = 0; i < changes.length; i++) {
        if (!seen[changes[i].tool]) {
            seen[changes[i].tool] = [];
            order.push(changes[i].tool);
        }
        seen[changes[i].tool].push(changes[i]);
    }
    var groups = [];
    for (var g = 0; g < order.length; g++) {
        groups.push({ tool: order[g], changes: seen[order[g]] });
    }
    return groups;
}

function renderChangeRow(parent, change) {
    var row = el('div', 'sd-change');

    row.appendChild(el('span', 'sd-change__field', change.fieldName));

    var flow = el('span', 'sd-change__flow');
    flow.appendChild(el('span', 'sd-change__val sd-change__val--now', change.current));
    flow.appendChild(el('span', 'sd-change__arrow', '\u2192'));
    flow.appendChild(el('span', 'sd-change__val sd-change__val--next', change.next));
    row.appendChild(flow);

    parent.appendChild(row);
    counts.changeRows++;

    /* The porter's one-line summaries of a site-exception change -
       which sites lose their exception, which gain one - the same
       lines the import preview dialog shows. */
    var summary = change.summary || [];
    for (var i = 0; i < summary.length; i++) {
        row.appendChild(el('p', 'sd-change__summary', summary[i]));
        counts.summaryRows++;
    }
}

function plainList(root, headingKey, listKey, entries) {
    if (!entries.length) {
        return;
    }

    root.appendChild(el('h2', 'vx-h', t(headingKey)));
    var list = el('ul', 'sd-plainlist ' + listKey);
    for (var i = 0; i < entries.length; i++) {
        var item = el('li', 'sd-in');
        stagger(item, i);
        item.appendChild(el('span', 'sd-plainlist__item', entries[i]));
        list.appendChild(item);
    }
    root.appendChild(list);
}

function renderDiff(root) {
    var preset = OSZA_DIFF.preset;
    var preview = OSZA_DIFF.preview;

    if (!preview || !preview.ok) {
        var broken = el('div', 'sd-banner sd-banner--fail');
        broken.appendChild(el('span', 'sd-banner__text',
            tf('broken_text', [preview && preview.error ? preview.error : ''])));
        root.appendChild(broken);
        return;
    }

    var groups = toolsWithChanges(preview.changes || []);
    var toolCount = groups.length;
    var changeCount = (preview.changes || []).length;

    /* The banner: one sentence about what this baseline does here. */
    var bannerText;
    if (changeCount === 0) {
        bannerText = tf('banner_none', [preset.name]);
    } else if (changeCount === 1) {
        bannerText = tf('banner_changes_single', [preset.name, toolCount]);
    } else {
        bannerText = tf('banner_changes', [preset.name, changeCount, toolCount]);
    }

    var banner = el('div', changeCount === 0 ? 'sd-banner' : 'sd-banner sd-banner--changes');
    var text = el('span', 'sd-banner__text', bannerText);
    text.appendChild(el('span', 'sd-banner__note', t('banner_preset_source')));
    banner.appendChild(text);

    if ((preview.skippedTools || []).length === 1) {
        text.appendChild(el('span', 'sd-banner__note', t('banner_skipped_one')));
    } else if ((preview.skippedTools || []).length > 1) {
        text.appendChild(el('span', 'sd-banner__note', tf('banner_skipped_many', [preview.skippedTools.length])));
    }

    root.appendChild(banner);

    /* The notation legend, once: Now -> With the baseline. */
    if (changeCount > 0) {
        root.appendChild(el('h2', 'vx-h', '%CHANGES-HEADING%'));

        var legend = el('div', 'sd-legend');
        legend.appendChild(el('span', null, '%COLUMN-CURRENT%'));
        legend.appendChild(el('span', 'sd-change__arrow', '\u2192'));
        legend.appendChild(el('span', null, '%COLUMN-AFTER%'));
        root.appendChild(legend);

        var tools = el('div', 'sd-tools');

        for (var g = 0; g < groups.length; g++) {
            var group = groups[g];
            var section = el('section', 'sd-tool sd-in');
            stagger(section, g);
            section.setAttribute('data-tool', group.tool);

            var head = el('div', 'sd-tool__head');
            head.appendChild(el('span', 'sd-tool__name', group.changes[0].toolName));
            head.appendChild(el('span', 'sd-tool__count', String(group.changes.length)));
            section.appendChild(head);

            for (var c = 0; c < group.changes.length; c++) {
                renderChangeRow(section, group.changes[c]);
            }

            tools.appendChild(section);
            counts.toolSections++;
        }

        root.appendChild(tools);
    }

    root.appendChild(el('h2', 'vx-h', '%DETAIL-HEADING%'));

    var skipped = preview.skippedTools || [];
    counts.skippedRows = skipped.length;
    plainList(root, 'heading_skipped', 'sd-plainlist--skipped', skipped);

    var unchanged = preview.unchangedTools || [];
    counts.unchangedRows = unchanged.length;
    plainList(root, 'heading_unchanged', 'sd-plainlist--unchanged', unchanged);

    var quiet = preview.quietTools || [];
    counts.quietRows = quiet.length;
    plainList(root, 'heading_quiet', 'sd-plainlist--quiet', quiet);
}

/* --- Unknown preset: a dead end with a way back ------------------------- */

function renderUnknown(root) {
    var banner = el('div', 'sd-banner sd-banner--warn');
    var text = el('span', 'sd-banner__text', t('unknown_title'));
    text.appendChild(el('span', 'sd-banner__note', tf('unknown_text', [OSZA_DIFF.presetId])));
    banner.appendChild(text);
    root.appendChild(banner);

    root.appendChild(el('h2', 'vx-h', '%OVERVIEW-HEADING%'));
    root.appendChild(el('p', 'sd-intro', '%OVERVIEW-INTRO%'));

    var list = el('div', 'sd-presets');
    var presets = OSZA_DIFF.presets || [];
    for (var i = 0; i < presets.length; i++) {
        var card = el('a', 'sd-preset sd-in');
        card.href = 'osza:settings-diff?preset=' + encodeURIComponent(presets[i].id);
        stagger(card, i);
        card.appendChild(el('span', 'sd-preset__name', presets[i].name));
        card.appendChild(el('span', 'sd-preset__desc', presets[i].description));
        list.appendChild(card);
        counts.presetCards++;
    }
    root.appendChild(list);
}

/* --- Mount -------------------------------------------------------------- */

(function () {
    var root = document.getElementById('sd-content');

    if (OSZA_DIFF.mode === 'diff') {
        renderDiff(root);
    } else if (OSZA_DIFF.mode === 'unknown') {
        renderUnknown(root);
    } else {
        renderOverview(root);
    }

    var reload = document.getElementById('sd-reload');
    if (reload) {
        reload.addEventListener('click', function () {
            location.reload();
        });
    }

    /* The "All baselines" link is only noise on the overview itself. */
    var overviewLink = document.getElementById('sd-overview-link');
    if (overviewLink && OSZA_DIFF.mode === 'overview') {
        overviewLink.style.display = 'none';
    }
})();
</script>
</body>
</html>
