<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>%TITLE%</title>
<link rel="stylesheet" href="qrc:html/oszapage.css">
<style>
/* Page-specific rules. Dynamic values (icon, translated strings)
   are substituted by OszaSchemeHandler in this document only. */
body { direction: %DIRECTION%; }

.vx-restore__head { display: flex; align-items: center; gap: 16px; margin-block-end: 6px; }
.vx-restore__head img { flex: none; inline-size: 45px; block-size: 45px; }

.vx-h--recovery { margin-block-start: 18px; }

/* Session tree — rows are appended by restore.user.js:
   tr.window / tr.tab, each a single td with
   checkbox + (favicon img) + span; tr.selected is the clicked row. */
#listview td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#listview tr.window td { cursor: default; }

#listview tr.window span {
    font-family: var(--osza-font-mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--osza-text);
}

#listview tr.tab td { padding-inline-start: 34px; cursor: default; }

#listview img { inline-size: 16px; block-size: 16px; margin-inline-end: 8px; vertical-align: -3px; }

#listview input { margin-inline-end: 10px; vertical-align: -2px; }

#listview tbody tr:hover td { background: var(--osza-card-bg-hover); }

#listview tbody tr.selected td { background: rgba(var(--osza-accent-rgb), 0.12); }

#listview tr.js-disabled:hover td,
#listview tbody tr.js-disabled:hover td { background: transparent; }
#listview td.js-disabled { text-align: center; block-size: 120px; color: var(--osza-text-faint); }

.vx-restore__actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-block-start: 20px;
    padding-block-start: 16px;
    border-block-start: 1px solid var(--osza-card-border);
}
</style>
</head>
<body>

    <p hidden id="script-data"
        data-window="%WINDOW%">
    </p>

<main class="vx-stage">
  <section class="vx-card vx-card--wide" aria-label="%TITLE%">
    <div class="vx-restore__head">
      <img src="%IMAGE%" alt="">
      <div>
        <h1 class="vx-title">%OOPS%</h1>
        <p class="vx-subtitle">%APOLOGIZE%</p>
      </div>
    </div>

    <h2 class="vx-h vx-h--recovery">%WINDOWS-AND-TABS%</h2>

    <div class="vx-scroll">
      <table id="listview" class="vx-table">
        <tbody id="recovery-items">
          <noscript>
            <tr class="js-disabled">
              <td class="js-disabled">%JAVASCRIPT-DISABLED%</td>
            </tr>
          </noscript>
        </tbody>
      </table>
    </div>

    <form class="vx-restore__actions">
      <input class="vx-btn" type="submit" id="start-new-session-button" name="new-session" value="%BUTTON-START-NEW%">
      <input class="vx-btn vx-btn--primary" type="submit" id="restore-session-button" name="restore-session" value="%BUTTON-RESTORE%">
    </form>
  </section>
</main>
</body>

</html>
