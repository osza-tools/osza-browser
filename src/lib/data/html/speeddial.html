<html id="html" lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%SITE-TITLE%</title>

<link rel="stylesheet" href="qrc:html/speeddial.css">

<style>
/* ============================================================
 * Dynamic values — injected by VeexSchemeHandler at serve time.
 * These rules MUST stay inline: the scheme handler performs
 * placeholder substitution on the HTML document only, never on
 * the linked speeddial.css resource.
 * ============================================================ */
:root {
    --veex-wallpaper: url("%IMG_BACKGROUND%");
}

body {
    direction: %DIRECTION%;
}

/* Thumbnail loading state (spinner) */
#quickdial img[src="%LOADING-IMG%"] {
    position: absolute;
    inset: 0;
    margin: auto;
    inline-size: 44px;
    block-size: 44px;
    object-fit: contain;
    opacity: 0.9;
    animation: veex-pulse 1.6s ease-in-out infinite;
}

#overlay-edit img[src="%LOADING-IMG%"] {
    inline-size: 44px;
    block-size: 44px;
}

/* Empty state label (translated) */
#quickdial:empty::after {
    content: "+ %ADD-TITLE%";
}

/* Wallpaper picker preview (initial value) */
#settingsBox #thumb {
    background-image: url("%IMG_BACKGROUND%");
    background-size: %B_SIZE%;
}
</style>
</head>

<body>

<!-- Background layer system (see speeddial.css, section 3) -->
<div class="background-layer background-layer--base" aria-hidden="true"></div>
<div class="background-layer background-layer--mesh" aria-hidden="true"></div>
<div class="background-layer background-layer--wallpaper" aria-hidden="true"></div>

<header class="sd-header">
    <div class="sd-header__inner">
        <div class="sd-brand" aria-hidden="true">VEEX<span class="sd-brand__sub">speed&nbsp;dial</span></div>

        <form class="omni" action="https://duckduckgo.com/" method="GET" role="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
            <input class="omni__input" type="text" name="q" placeholder="Search the web" aria-label="Search the web" />
        </form>

        <button id="button-configure-speed-dial" class="icon-btn sett" type="button" title="%SETTINGS-TITLE%" aria-label="%SETTINGS-TITLE%" aria-haspopup="dialog">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
    </div>
</header>

<main class="dial-container">
    <!-- Kept free of whitespace so the CSS :empty empty-state works;
         entries are appended here by speeddial.user.js -->
    <div id="quickdial" class="speeddial-grid"></div>
</main>

<button id="button-add-speed-dial" class="fab add" type="button" title="%ADD-TITLE%" aria-label="%ADD-TITLE%">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"></path></svg>
</button>

<div id="fadeOverlay2" class="overlay" style="display:none;" role="dialog" aria-modal="true" aria-label="%SETTINGS-TITLE%">
<div id="settingsBox" class="sd-panel">
    <h2 class="sd-panel__title">%SETTINGS-TITLE%</h2>

    <div class="sd-setting-row">
        <div class="checkbox">
            <input type="checkbox" id="SdCntrToggle" name="sdcntrt" />
            <label for="SdCntrToggle" aria-hidden="true"></label>
            <span class="checkbox__text">%TXT_CNTRDLS%</span>
        </div>
    </div>

    <div class="sd-setting-row">
        <div class="checkbox">
            <input type="checkbox" id="SdLockDials" />
            <label for="SdLockDials" aria-hidden="true"></label>
            <span class="checkbox__text">%TXT_LOCKDIALS%</span>
        </div>
    </div>

    <div class="sd-setting-row">
        <label class="sd-setting-label" for="PgInRow">%TXT_NRROWS%</label>
        <div class="sd-slider">
            <span id="sliderValuePg" class="sd-slider__value"></span>
            <input id="PgInRow" type="range" min="2" max="10" step="1" />
        </div>
    </div>

    <div class="sd-setting-row">
        <div class="checkbox">
            <input type="checkbox" id="SdSizeToggle" name="sdsizet" />
            <label for="SdSizeToggle" aria-hidden="true"></label>
            <span class="checkbox__text">%TXT_SDSIZE%</span>
        </div>
        <div class="sd-slider" id="SdSizeStateColor">
            <span id="sliderValueSd" class="sd-slider__value"></span>
            <input id="SdSize" type="range" min="100" max="500" step="1" />
        </div>
    </div>

    <div id="ImgSelector">
        <div id="BgImgSel" class="thumbhold" disabled="disabled"><p id="thumb">%TXT_SELECTIMAGE%</p></div>
        <p class="sd-hidden-inputs">
            <input id="BgImgHold" type="hidden" value="%IMG_BACKGROUND%" />
            <input id="BgImgHoldUrl" type="hidden" value="%URL_BACKGROUND%" />
        </p>
        <div class="checkbox" id="ImgSelectorToggle">
            <input type="checkbox" id="BgImgToggle" name="sdbackimg" />
            <label for="BgImgToggle" aria-hidden="true"></label>
            <span class="checkbox__text">%TXT_NOTE%</span>
        </div>
        <div id="ImgSelectorMenu">
            <label class="sd-setting-label" for="BgImgSelSiz">%TXT_PLACEMENT%</label>
            <select id="BgImgSelSiz" name="imgselsize">
                <option value="contain">%TXT_FIT%</option>
                <option value="auto">%TXT_AUTO%</option>
                <option value="cover">%TXT_COVER%</option>
                <option value="100% auto">%TXT_FWIDTH%</option>
                <option value="auto 100%">%TXT_FHEIGHT%</option>
            </select>
        </div>
    </div>

    <div class="buttonbox">
        <input id="button-cancel" type="button" value="%CANCEL%" />
        <input id="button-apply" type="button" value="%APPLY%" />
    </div>
</div>
</div>

<p hidden id="script-data"
    data-img-background="%IMG_BACKGROUND%"
    data-url-background="%URL_BACKGROUND%"
    data-loading-image="%LOADING-IMG%"
    data-left-str="%LEFT_STR%"
    data-b-size="%B_SIZE%"
    data-cancel="%CANCEL%"
    data-url="%URL%"
    data-title="%TITLE%"
    data-edit="%APPLY%"
    data-new-page="%NEW-PAGE%"
    data-title-edit="%TITLE-EDIT%"
    data-title-remove="%TITLE-REMOVE%"
    data-title-reload="%TITLE-RELOAD%"
    data-title-fetch-title="%TITLE-FETCHTITLE%"
    data-title-warn="%TITLE-WARN%"
    data-title-warn-rel="%TITLE-WARN-REL%"
    data-max-pages-row="%ROW-PAGES%"
    data-dial-width="%SD-SIZE%"
    data-sd-center="%SD-CENTER%"
    data-initial-script='%INITIAL-SCRIPT%'
    data-lock-dials='%LOCK-DIALS%'>
</p>

<noscript>%JAVASCRIPT-DISABLED%</noscript>

</body>
</html>
