<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>%TITLE%</title>
<link rel="stylesheet" href="qrc:html/oszapage.css">
<style>
body { direction: %DIRECTION%; }

.vx-about__head { display: flex; align-items: center; gap: 20px; margin-block-end: 8px; }
.vx-about__head img { flex: none; inline-size: 96px; block-size: 96px; }

.vx-about p { margin-block: 4px 12px; color: var(--osza-text-dim); }
.vx-about p a { overflow-wrap: anywhere; }
</style>
</head>
<body>
<main class="vx-stage">
  <section class="vx-card vx-card--wide vx-about" aria-label="%ABOUT-OSZA%">
    <div class="vx-about__head">
      <img class="light" src="%ABOUT-IMG%" alt="">
      <img class="dark" src="%ABOUT-IMG-DARK%" alt="">
      <div>
        <h1 class="vx-title">%ABOUT-OSZA%</h1>
        <p class="vx-subtitle">%INFORMATIONS-ABOUT-VERSION%</p>
      </div>
    </div>

    <h2 class="vx-h">%INFORMATIONS-ABOUT-VERSION%</h2>
    <dl>
      %VERSION-INFO%
    </dl>

    <h2 class="vx-h">%MAIN-DEVELOPER%</h2>
    <p>%MAIN-DEVELOPER-TEXT%</p>

    <h2 class="vx-h">%COPYRIGHT%</h2>
    <pre>%COPYRIGHT-INCLUDE%</pre>
  </section>
</main>
</body>
</html>
