<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%TITLE%</title>
<link rel="stylesheet" href="qrc:html/veexpage.css">
<style>
/* Page-specific rules. Dynamic values (icons, translated strings)
   are substituted by VeexSchemeHandler in this document only. */
body { direction: %DIRECTION%; }

.vx-start__logo { inline-size: 250px; max-inline-size: 80%; block-size: auto; margin-block-end: 10px; }

/* Private browsing notice — injected by the scheme handler as <h1> */
.vx-start h1 {
    display: inline-block;
    margin-block: 4px 14px;
    padding: 6px 16px;
    border: 1px solid rgba(var(--veex-accent-rgb), 0.45);
    border-radius: 999px;
    background: var(--veex-accent-dim);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--veex-accent);
}

/* Search pill: icon + input + primary action in one rounded control */
.vx-search {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-block-start: 18px;
    padding: 6px 6px 6px 18px;
    border: 1px solid var(--veex-card-border);
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.25);
    transition: border-color var(--veex-speed) var(--veex-ease), box-shadow var(--veex-speed) var(--veex-ease);
}

@media (prefers-color-scheme: light) {
    .vx-search { background: rgba(255, 255, 255, 0.75); }
}

.vx-search:hover { border-color: rgba(255, 255, 255, 0.25); }
.vx-search:focus-within { border-color: var(--veex-card-border-hover); box-shadow: var(--veex-glow); }

.vx-search svg { flex: none; color: var(--veex-text-faint); }

.vx-search__input {
    flex: 1;
    min-width: 0;
    block-size: 38px;
    border: none;
    outline: none;
    background: transparent;
    color: var(--veex-text);
    font-family: var(--veex-font-sans);
    font-size: 14.5px;
    -webkit-user-select: auto;
    user-select: auto;
}
.vx-search__input::placeholder { color: var(--veex-text-dim); }

.vx-search__submit { flex: none; block-size: 38px; }

.vx-start__footer { margin-block-start: 26px; }
.vx-start__footer a { margin-inline-start: 4px; }
</style>
</head>
<body onload="document.getElementById('inp').focus()">
<main class="vx-stage">
  <section class="vx-card vx-start" aria-label="%TITLE%">
    <img class="light vx-start__logo" src="%ABOUT-IMG%" alt="">
    <img class="dark vx-start__logo" src="%ABOUT-IMG-DARK%" alt="">
    %PRIVATE-BROWSING%

    <form class="vx-search" action="https://duckduckgo.com/" method="GET" role="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
        <input class="vx-search__input" id="inp" type="text" name="q" placeholder="%SEARCH-PLACEHOLDER%" aria-label="%SEARCH-PLACEHOLDER%" />
        <input class="vx-btn vx-btn--primary vx-search__submit" type="submit" value="%BUTTON-LABEL%">
    </form>

    <p class="vx-note vx-start__footer">%SEARCH-BY% &middot; <a href="%WWW%">%ABOUT-VEEX%</a></p>
  </section>
</main>
</body>
</html>
