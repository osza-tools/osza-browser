# Builds Osza Browser packages for every supported platform on a version tag
# and attaches them to the corresponding GitHub release.
#
# Jobs are independent on purpose: one failing platform never blocks the
# others' assets from being published.
name: Release packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-tarball:
    name: Linux (tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Enable KDE Neon repository (Ubuntu 24.04 lacks KF6 packages)
        run: |
          if grep -q 'noble' /etc/os-release; then
            curl -fsSL 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x444DABCF3667D0283F894EDDE6D4736255751E5D' \
              | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/kde-neon-user.gpg
            echo "deb http://origin.archive.neon.kde.org/user noble main" | sudo tee /etc/apt/sources.list.d/kde-neon-user.list
            sudo apt-get update
          else
            echo "Runner already ships KF6 packages; skipping Neon repo."
          fi

      - name: Install build dependencies
        run: sudo ./linux/install-build-deps.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Stage install
        run: cmake --install build --prefix dist/usr --strip

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -C dist --sort=name --numeric-owner --owner=0 --group=0 \
            -czf "Osza-Browser-${VERSION}-linux-x86_64.tar.gz" usr

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: Osza-Browser-*-linux-x86_64.tar.gz
          fail_on_unmatched_patterns: true
          overwrite_files: true
          retries: 3

  linux-snap:
    name: Linux (snap)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build snap
        id: snap
        uses: snapcore/action-build@v1

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.snap.outputs.snap }}
          fail_on_unmatched_patterns: true
          overwrite_files: true
          retries: 3

  macos-dmg:
    name: macOS (dmg)
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install qt qtwebengine karchive ki18n extra-cmake-modules openssl@3
          echo "HOMEBREW_P=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DBUILD_PYTHON_SUPPORT=OFF
          -DBUILD_KEYRING=OFF
          -DOPENSSL_ROOT_DIR="${HOMEBREW_P}/opt/openssl@3"
          -DCMAKE_PREFIX_PATH="$HOMEBREW_P/opt/qt;$HOMEBREW_P/opt/qtwebengine;$HOMEBREW_P/opt/karchive;$HOMEBREW_P/opt/ki18n"

      - name: Build
        run: cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Locate app bundle
        run: echo "BUNDLE=$(ls -d build/bin/*.app | head -n 1)" >> "$GITHUB_ENV"

      - name: Bundle plugins, private library and resources
        run: |
          set -u
          APP="$BUNDLE"
          LIB_FILE=$(ls build/bin/libOszaPrivate*.dylib | head -n 1)
          LIB=$(basename "$LIB_FILE")
          cp "$LIB_FILE" "$APP/Contents/MacOS/"
          mkdir -p "$APP/Contents/Resources/plugins"
          cp -R build/bin/plugins/. "$APP/Contents/Resources/plugins/"
          mkdir -p "$APP/Contents/Resources/themes"
          cp -R themes/. "$APP/Contents/Resources/themes/"
          if [ -d build/bin/locale ]; then
            cp -R build/bin/locale "$APP/Contents/Resources/locale"
          fi
          # Fix the import references to the private library, whatever install
          # name CMake recorded for it in the build tree
          OLDID=$(otool -D "$APP/Contents/MacOS/$LIB" | tail -n 1 | awk '{print $1}')
          targets=$(find "$APP/Contents/MacOS" "$APP/Contents/Resources/plugins" -type f \( -name '*.dylib' -o -perm -u+x \))
          for f in $targets; do
            if otool -L "$f" 2>/dev/null | grep -q libOszaPrivate; then
              install_name_tool -change "$OLDID" "@executable_path/$LIB" "$f" 2>/dev/null || true
              install_name_tool -change "libOszaPrivate.2.dylib" "@executable_path/$LIB" "$f" 2>/dev/null || true
            fi
          done
          # NOTE: never write $targets to $GITHUB_ENV — find() output is
          # multi-line and GITHUB_ENV only accepts single-line "key=value"
          # records (use the heredoc "<<EOF" form if it is ever needed).

      - name: Run macdeployqt
        run: |
          "$HOMEBREW_P/opt/qt/bin/macdeployqt" "$BUNDLE" -qmldir="$PWD/src/lib/data/data"

      - name: Bundle non-Qt libraries (KF6/OpenSSL) and fix remaining references
        run: |
          set -u
          APP="$BUNDLE"
          FW="$APP/Contents/Frameworks"
          mkdir -p "$FW"
          # Qt frameworks were already bundled by macdeployqt; rewrite every
          # remaining absolute /opt/homebrew reference in-place to @rpath and
          # copy plain dylibs into the bundle. Three passes handle transitive
          # copied libraries.
          for pass in 1 2 3; do
            targets=$(find "$APP/Contents/MacOS" "$APP/Contents/Resources/plugins" "$FW" \
                        -type f \( -name '*.dylib' -o -perm -u+x \))
            for f in $targets; do
              deps=$(otool -L "$f" 2>/dev/null | tail -n +2 | awk '{print $1}' \
                       | grep '^/opt/homebrew/' || true)
              for dep in $deps; do
                rel="${dep#*/lib/}"
                [ -n "$rel" ] && [ "$rel" != "$dep" ] || rel=$(basename "$dep")
                if [ -d "${dep%.framework/Versions/*}" ] && printf '%s' "$dep" | grep -qF '.framework'; then
                  rel="${dep#*/lib/}"
                fi
                case "$dep" in
                  *.framework/*) mkdir -p "$FW/$(dirname "$rel")"; cp -Rf "$dep" "$FW/$rel" ;;
                  *) cp -f "$dep" "$FW/$rel" ;;
                esac
                install_name_tool -change "$dep" "@rpath/$rel" "$f" 2>/dev/null || true
              done
            done
          done
          # Ensure every shipped Mach-O can resolve @rpath against Contents/Frameworks
          targets=$(find "$APP/Contents/MacOS" "$APP/Contents/Resources/plugins" "$FW" \
                      -type f \( -name '*.dylib' -o -perm -u+x \))
          for f in $targets; do
            if ! otool -l "$f" 2>/dev/null | grep -Fq '@executable_path/../Frameworks'; then
              install_name_tool -add_rpath "@executable_path/../Frameworks" "$f" 2>/dev/null || true
            fi
          done

      - name: Assemble and create DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="$(mktemp -d)/Osza"
          mkdir -p "$STAGE"
          cp -R "$BUNDLE" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Osza -srcfolder "$STAGE" -ov -format UDZO \
            "Osza-Browser-${VERSION}-macos-arm64.dmg"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: Osza-Browser-*-macos-arm64.dmg
          fail_on_unmatched_patterns: true
          overwrite_files: true
          retries: 3

  windows-zip:
    name: Windows (zip)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (MSVC, with WebEngine)
        uses: jurplel/install-qt-action@v4
        with:
          # Qt 6.8 LTS: its current patch release bundles a much newer Chromium
          # than 6.7 ever will, which matters a lot for a web browser.
          # MSVC 2022 archives are the default for Qt >= 6.8.
          version: "6.8.*"
          arch: win64_msvc2022_64
          modules: qtwebengine
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install OpenSSL, zlib, bzip2 and lzma via vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows zlib:x64-windows bzip2:x64-windows liblzma:x64-windows

      - name: Build Extra CMake Modules and KF6 Archive
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force deps | Out-Null
          foreach ($proj in @('extra-cmake-modules', 'karchive')) {
            # Clone the KDE GitHub mirrors instead of downloading tarballs
            # from download.kde.org: the CDN stalls regularly on Windows
            # runners and curl retry loops have burned 60+ minutes waiting
            # for a single tarball. GitHub-to-GitHub clones take seconds.
            $dst = "deps/$proj"
            if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
            git clone --depth 1 --branch v6.13.0 "https://github.com/KDE/$proj.git" $dst
            if ($LASTEXITCODE -ne 0) { throw "clone failed: KDE/$proj v6.13.0" }
            $cmakeArgs = @(
              "-S", $dst, "-B", "deps/$proj-build", "-G", "Ninja",
              "-DCMAKE_BUILD_TYPE=Release",
              "-DCMAKE_INSTALL_PREFIX=$PWD/deps/install",
              "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake",
              "-DBUILD_TESTING=OFF"
            )
            if ($proj -eq 'karchive') {
              # karchive 6.13 enables its optional OpenSSL backend by default,
              # which hard-requires pkg-config + libzstd on the configure line
              # (find_package(PkgConfig REQUIRED) + pkg_check_modules(libzstd
              # REQUIRED)). Neither exists on the runner and Osza only uses
              # KArchive's core zip/tar/gzip paths, so build without it.
              # BZip2/LibLZMA stay optional and are found from vcpkg above.
              $cmakeArgs += "-DWITH_OPENSSL=OFF"
            }
            cmake @cmakeArgs
            if ($LASTEXITCODE -ne 0) { throw "configure failed: $proj" }
            cmake --build "deps/$proj-build"
            if ($LASTEXITCODE -ne 0) { throw "build failed: $proj" }
            cmake --install "deps/$proj-build"
            if ($LASTEXITCODE -ne 0) { throw "install failed: $proj" }
          }

      - name: Configure Osza
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$PWD/deps/install" `
            -DOPENSSL_ROOT_DIR="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" `
            -DBUILD_TESTING=OFF `
            -DBUILD_PYTHON_SUPPORT=OFF `
            -DBUILD_KEYRING=OFF `
            -DBUILD_TRANSLATIONS=OFF

      - name: Build Osza
        shell: pwsh
        run: cmake --build build

      - name: Deploy Qt runtime and assemble zip
        shell: pwsh
        run: |
          $qtRoot = $env:QT_ROOT_DIR
          if (-not $qtRoot) {
            $qtRoot = ((Get-Command qmake.exe).Source | Split-Path | Split-Path)
          }
          $qtBin = "$qtRoot\bin"
          windeployqt --release --compiler-runtime --qmldir src/lib/data/data build/bin/osza.exe
          foreach ($src in @("$qtBin\QtWebEngineProcess.exe", "$qtBin\Qt6WebEngineCore.dll", "$qtBin\Qt6WebEngine.dll", "$qtBin\Qt6WebEngineWidgets.dll")) {
            if (Test-Path $src) { Copy-Item $src 'build\bin' -Force }
          }
          foreach ($dir in @("$qtRoot\resources", "$qtBin\resources")) {
            if (Test-Path $dir) { Copy-Item $dir 'build\bin\resources' -Recurse -Force }
          }
          foreach ($dir in @("$qtRoot\translations\qtwebengine_locales", "$qtBin\translations\qtwebengine_locales")) {
            if (Test-Path $dir) {
              New-Item -ItemType Directory -Force 'build\bin\translations' | Out-Null
              Copy-Item $dir 'build\bin\translations\qtwebengine_locales' -Recurse -Force
            }
          }
          # OpenSSL + zlib runtime DLLs from vcpkg
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          Get-ChildItem $vcpkgBin -Filter *.dll | Where-Object { $_.Name -match '^(libssl|libcrypto|zlib)' } |
            Copy-Item -Destination 'build\bin' -Force
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          Compress-Archive -Path build\bin\* -DestinationPath "Osza-Browser-$version-windows-x64.zip"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: Osza-Browser-*-windows-x64.zip
          fail_on_unmatched_patterns: true
          overwrite_files: true
          retries: 3
